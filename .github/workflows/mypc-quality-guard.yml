name: MyPC Quality Guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mypc-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-contract:
    name: guard-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified immutable SHA
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Framework and HF3 negative tests (no OS side effects)
        run: python -m unittest discover -s quality_guard/tests -p 'test_*.py' -v
      - name: Repository safety gate (strict; must be PASS after PID safety V3+)
        run: python quality_guard/check.py --root . --strict
      - name: Cursor shell-hook contract tests
        run: node --test .cursor/hooks/guard-shell.test.cjs

  backend-linux:
    name: backend-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: MyPC.Attendance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: MyPC.Attendance/backend/requirements-dev.txt
      - name: Install declared backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend unit/integration/acceptance (physical real_model excluded)
        run: python -m pytest -q -m "not real_model" tests/unit tests/integration tests/acceptance
        env:
          MYPC_OWNER_WINDOWS_USB: '0'
          PYTHONPATH: backend

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: MyPC.Attendance/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: MyPC.Attendance/frontend/package-lock.json
      - run: npm ci
      - run: npm run ci

  windows-contract:
    name: windows-contract
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Confirm genuine Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 required' }
          Write-Host 'PowerShell 5.1 verification passed; no candidate script execution.'
      - name: Parse every active Windows script without executing it
        shell: powershell
        run: |
          $scripts = @(Get-ChildItem 'MyPC.Attendance/scripts/windows' -Recurse -Filter '*.ps1' -File)
          if ($scripts.Count -eq 0) { throw 'No PowerShell scripts found' }
          foreach ($file in $scripts) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) { throw ('Parse errors in ' + $file.Name) }
          }
      - name: Install PowerShell static analyzer and Pester 5.9.0
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          Install-Module Pester -RequiredVersion 5.9.0 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
      - name: Check fatal PowerShell lint findings
        shell: powershell
        run: |
          Import-Module PSScriptAnalyzer -ErrorAction Stop
          $errors = @(Invoke-ScriptAnalyzer -Path 'MyPC.Attendance/scripts/windows' -Recurse -Severity Error)
          if ($errors.Count -gt 0) { $errors | Format-Table; throw 'PowerShell analyzer errors' }
      - name: Check reserved automatic-variable assignments
        shell: powershell
        run: |
          Import-Module PSScriptAnalyzer -ErrorAction Stop
          $warnings = @(Invoke-ScriptAnalyzer -Path 'MyPC.Attendance/scripts/windows' -Recurse -IncludeRule PSAvoidAssignmentToAutomaticVariable)
          if ($warnings.Count -gt 0) { $warnings | Format-Table; throw 'Automatic variable misuse detected' }
      - name: Pure Windows Pester safety tests (no fake PID kill)
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 5.9.0 -ErrorAction Stop
          $result = Invoke-Pester -Path 'quality_guard/powershell' -PassThru -Output Detailed
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) { throw 'Pester safety gate failed' }
      - name: Windows Python contract negatives (no hardware)
        shell: powershell
        run: python -m unittest discover -s quality_guard/tests -p 'test_*.py' -v
